[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syntra-client"
version = "0.1.0"
description = "Official Python SDK for the Syntra decision runtime"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["syntra", "bandit", "decision", "runtime", "llm-routing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
# Intentionally empty: the client is urllib + dataclasses only.
dependencies = []

[tool.setuptools]
packages = ["syntra_client"]

[tool.setuptools.package-data]
syntra_client = ["py.typed"]
