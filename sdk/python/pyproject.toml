[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "syntra"
version = "0.2.0"
description = "Microsecond decisions that learn: local evaluation client for the Syntra decision service"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[tool.maturin]
python-source = "python"
module-name = "syntra._native"
features = ["pyo3/extension-module"]
# Bytecode from local test runs is not part of the package.
exclude = ["python/syntra/__pycache__/**"]
