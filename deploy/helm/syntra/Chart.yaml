apiVersion: v2
name: syntra
description: |
  Syntra is a self-hosted decision service: contextual-bandit decisions
  with logged propensities, off-policy evaluation and gated promotion.
  This chart installs one Syntra server with a PersistentVolumeClaim for
  its store, plus an optional Ingress and ServiceMonitor.
type: application

# Chart version. Bump on any chart-only change (templates, values
# defaults, README). Independent of the Syntra binary version below.
version: 0.3.0

# appVersion tracks the syntra crate version (from Cargo.toml at the
# repo root). Update this when releasing a new syntra or lycan binary.
appVersion: "0.2.0"

kubeVersion: ">=1.24.0-0"

home: https://github.com/ashhart/Syntra
sources:
  - https://github.com/ashhart/Syntra

maintainers:
  - name: Syntra maintainers
    url: https://github.com/ashhart

keywords:
  - contextual-bandit
  - off-policy-evaluation
  - decisioning
  - personalization
  - lycan

annotations:
  category: MachineLearning
  licenses: Apache-2.0
