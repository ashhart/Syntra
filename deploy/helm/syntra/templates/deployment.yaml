apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "syntra.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "syntra.labels" . | nindent 4 }}
{{- if gt (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be 0 or 1: one store has one server (see values.yaml)" }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
{{- fail "autoscaling is not supported: one store has one server (see values.yaml)" }}
{{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    # Recreate stops the old pod before the new one opens the store.
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      {{- include "syntra.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "syntra.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pod when the admin Secret content changes.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        # Roll the pod when capsule ConfigMap content changes.
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "syntra.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: syntra
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The image's entrypoint is the `syntra` binary; these args are
          # the whole command line.
          args:
            - serve
            - --addr
            - "0.0.0.0:{{ .Values.syntra.port }}"
            - --store
            - {{ .Values.syntra.storePath | quote }}
            {{- if .Values.syntra.devMode }}
            - --dev-mode
            # Pods listen on 0.0.0.0; the binary refuses unauthenticated
            # non-loopback binds without this explicit opt-in.
            - --dev-mode-allow-remote
            {{- end }}
            {{- if .Values.syntra.metricsPublic }}
            - --metrics-public
            {{- end }}
            {{- if .Values.capsules }}
            - --specs
            - /etc/syntra/capsules
            {{- end }}
            {{- with .Values.syntra.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.syntra.port }}
              protocol: TCP
          {{- if or (not .Values.syntra.devMode) .Values.syntra.extraEnv }}
          env:
            {{- if not .Values.syntra.devMode }}
            # Omitted in devMode, where the binary runs unauthenticated.
            - name: SYNTRA_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "syntra.secretName" . }}
                  key: adminToken
            {{- end }}
            {{- with .Values.syntra.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: store
              mountPath: {{ .Values.syntra.storePath }}
            {{- if .Values.capsules }}
            - name: capsules
              mountPath: /etc/syntra/capsules
              readOnly: true
            {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: store
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "syntra.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.capsules }}
        - name: capsules
          configMap:
            name: {{ include "syntra.fullname" . }}-capsules
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
