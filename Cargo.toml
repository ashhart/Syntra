[package]
name = "syntra"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
description = "Self-hosted contextual-bandit decision service: propensity-logged decisions, off-policy evaluation and gated promotion"
default-run = "syntra"

[[bin]]
name = "syntra"
path = "src/main.rs"

[[bin]]
name = "lycan"
path = "src/bin/lycan.rs"

[dependencies]
bytes = "1"
flate2 = "1"
getrandom = "0.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "http1", "server-graceful"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse floats exactly, so logged probabilities and the
# decide section read back bit for bit (the SDKs' model tags depend on it).
# sdk/typescript/wasm must use the same features.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_norway = "0.9.42"
sha2 = "0.10"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
ureq = "2"

[dev-dependencies]
ureq = { version = "2", features = ["json"] }
