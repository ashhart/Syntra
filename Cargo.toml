[package]
name = "syntra"
version = "0.2.0"
edition = "2024"
description = "Syntra — self-hosted adaptive decision runtime built on the Lycan language"

[[bin]]
name = "syntra"
path = "src/main.rs"

[[bin]]
name = "lycan"
path = "src/bin/lycan.rs"

[dependencies]
getrandom = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
sha2 = "0.10"
tiny_http = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
ureq = "2"

[dev-dependencies]
dhat = "0.3.3"
ureq = { version = "2", features = ["json"] }
