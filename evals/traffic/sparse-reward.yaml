# Syntra-native traffic spec — sparse-reward stream.
# Schema: src/simulate.rs TrafficSpec::from_yaml.
#
# Every arm's true mean sits within 0.05 of zero while the observation
# noise is 0.25: the reward signal is roughly 1/5 of the noise floor, so the
# policy must pool many samples before the ordering of arms 0 and 1 is
# resolvable. Models sparse conversion/revenue objectives.
#
# Pairs with evals/traffic/capsules/routing-4arm-sparse.yaml, whose
# `sparse_continuous` reward makes `algorithm: auto` resolve to UCB1.
#
# Run:
#   syntra simulate evals/traffic/capsules/routing-4arm-sparse.yaml \
#       --traffic evals/traffic/sparse-reward.yaml --rounds 2000 --seeds 8 \
#       --compare-baseline epsilon-greedy:0.1 --format json
#
# Best arm: index 0 (0.050). Uniform-random expected per-round regret:
# mean(0.05 - arms) = 0.0275.
arms: [0.050, 0.040, 0.010, 0.005]
noise_std: 0.25

context_distribution:
  values: [cold_start, returning, power_user]
  weights: [0.55, 0.3, 0.15]
