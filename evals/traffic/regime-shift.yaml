# Syntra-native traffic spec — nonstationary stream with two regime shifts.
# Schema: src/simulate.rs TrafficSpec::from_yaml.
#
# The best arm flips from index 0 (0.90) to index 3 (0.85) at round 600, then
# flips back to index 1 (0.72) at round 1400. Any policy that stops
# exploring pays for the shift; regret-vs-oracle is recomputed against the
# POST-shift best arm, so a policy that keeps its pre-shift favourite takes
# the full 0.9 - 0.35 gap per round until it re-learns.
#
# Run:
#   syntra simulate evals/traffic/capsules/routing-4arm-weighted.yaml \
#       --traffic evals/traffic/regime-shift.yaml --rounds 2000 --seeds 8 \
#       --compare-baseline first-arm --format json
#
# `regime_shifts` must be in strictly increasing `at_round` order and each
# `new_rewards` list must have one entry per capsule option.
arms: [0.90, 0.50, 0.30, 0.10]
noise_std: 0.05

context_distribution:
  values: [z_low, z_mid, z_high]
  weights: [0.5, 0.35, 0.15]

regime_shifts:
  - at_round: 600
    new_rewards: [0.20, 0.35, 0.55, 0.85]
  - at_round: 1400
    new_rewards: [0.30, 0.72, 0.45, 0.25]
