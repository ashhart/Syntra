# Eval capsule: 4-option routing decision pinned to UCB1 on a continuous
# reward. Used by the strategy-selection ablation in
# docs/evaluations/2026-09-08-adaptive-policy-baseline.md.
name: eval-routing-4arm-ucb
version: 0.1.0

options:
  - primary
  - secondary
  - degraded_cache_only
  - circuit_break

reward:
  type: continuous
  range: [-1.0, 1.0]

algorithm:
  type: ucb

learning:
  min_exploration: 0.05
