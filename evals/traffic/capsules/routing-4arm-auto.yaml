# Eval capsule: 4-option routing decision, `algorithm: auto` with a
# continuous reward. `CapsuleSpec::resolved_algorithm` maps
# continuous -> simpleWeighted, so this is the spec that reproduces the
# weighted-selection behaviour discussed in
# docs/evaluations/2026-09-08-adaptive-policy-baseline.md.
#
# Options are index-aligned with `arms` in evals/traffic/*.yaml:
#   0 primary  1 secondary  2 degraded_cache_only  3 circuit_break
name: eval-routing-4arm-auto
version: 0.1.0

options:
  - primary
  - secondary
  - degraded_cache_only
  - circuit_break

reward:
  type: continuous
  range: [-1.0, 1.0]

algorithm:
  type: auto

learning:
  min_exploration: 0.05
