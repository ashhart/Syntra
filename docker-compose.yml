name: syntra

services:
  syntra:
    build:
      # Build context is this repo root (one crate builds both binaries).
      context: .
      dockerfile: Dockerfile
    image: syntra
    container_name: syntra
    ports:
      - "8787:8787"
    volumes:
      - syntra-store:/var/lib/syntra
    environment:
      - SYNTRA_ADMIN_KEY=${SYNTRA_ADMIN_KEY:?Set SYNTRA_ADMIN_KEY in .env or the environment}
    command: ["serve", "--addr", "0.0.0.0:8787", "--store", "/var/lib/syntra"]
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  syntra-store:
