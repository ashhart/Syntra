[package]
name = "syntra-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
sha2 = "0.10"

[dependencies.syntra]
path = ".."

[[bin]]
name = "graph_from_bytes"
path = "fuzz_targets/graph_from_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lycs_parse"
path = "fuzz_targets/lycs_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "binary_decode"
path = "fuzz_targets/binary_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decision_spec_json"
path = "fuzz_targets/decision_spec_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model_snapshot"
path = "fuzz_targets/model_snapshot.rs"
test = false
doc = false
bench = false
